services:
  gestor-tareas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestor-tareas
    ports:
      - "4200:4200"
    volumes:
      # Montamos el código para que los cambios se reflejen sin reconstruir la imagen
      - .:/app
      # Evita que node_modules del host (si existiera) sobreescriba el del contenedor
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NG_CLI_ANALYTICS=false
    stdin_open: true
    tty: true
